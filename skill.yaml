schema: skill-manifest/v1
id: lov-media-creator
version: "0.17.0"
runtime: skill-runtime/v1
context:
  profile:
    schema: user-profile/v1
    source: shared-profile
    read:
      - user
      - brand
      - workspace
      - preferences
      - skills.lov-media-creator
    persist:
      enabled: true
      namespace: skills.lov-media-creator
      records_path: skills.lov-media-creator.records
      write_policy: direct-user-statement
      atomic: true
    fields:
      - path: user.language
        aliases:
          - identity.language
        required: false
        question: 希望使用哪种语言输出？
      - path: user.timezone
        required: false
        question: 需要使用哪个时区处理日期和时间？
      - path: brand.name
        aliases:
          - identity.name
        required: false
        question: 如果本次输出需要品牌身份，请提供品牌名称。
      - path: brand.site
        required: false
        question: 如果封面或交付页需要品牌官网，请提供地址。
      - path: brand.tone
        required: false
        question: 如果已有品牌语气或审美关键词，请提供它们。
      - path: workspace.output_dir
        aliases:
          - workspace.root
        required: false
        question: 如果需要默认输出目录，请提供工作区位置。
  preferences:
    namespace: lov_media_creator
    fields:
      - path: preferences.media.aspect_ratio
        required: false
        question: 默认成片使用哪种画幅？
      - path: preferences.media.loudness_target
        required: false
        question: 默认响度目标是否沿用 -16 LUFS-I？
      - path: preferences.media.preserve_result_audio
        required: false
        question: 是否默认保护最终结果段的原声？
      - path: skills.lov-media-creator.records.subtitle_review_workflow
        required: false
        question: 需要 Subtitle Edit 修正字幕时，是否封装内嵌可编辑 SRT 的 MKV，并在批准后再生成平台文件？
      - path: skills.lov-media-creator.records.preview_workflow
        required: false
        question: 是否以 Remotion Studio 为主预览，并只把 MKV 用于字幕修正交接？
      - path: skills.lov-media-creator.records.incremental_iteration
        required: false
        question: 是否默认按 draft、locked、approved 三阶段复用缓存并只运行失效环节？
      - path: skills.lov-media-creator.records.screen_studio_remotion_qc
        required: false
        question: Screen Studio 项目是否执行完整句、摄像头连续、官网产品卡和片尾资源页门禁？
      - path: skills.lov-media-creator.records.bgm_multi_track
        required: false
        question: Vlog 等叙事片是否从你给的整个曲库按叙事混合多首 BGM，只以成片效果取舍？
  interaction:
    ask_missing: true
    max_questions: 1
